<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf B - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-b: #2575FC;
            --secondary-b: #6A11CB;
            --accent-pink: #FF3366;
            --yellow: #FFD93D;
            --green: #2ECC71;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #F0F5FF;
            border-color: #CCDFFF;
            color: var(--primary-b);
        }

        /* SLOT IKLAN AUTO-HIDE (Sembunyi otomatis bila kosong) */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA B (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #D3E4FF;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(37, 117, 252, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-b);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #F4F8FF;
            border: 2.5px solid #D3E4FF;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-b);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu kata ganda */
        .card-pink {
            background: #FFF5F7;
            border-color: #FFCCD8;
            color: #FF3366;
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #F0FDF4;
            border: 3px solid #DCFCE7;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(46, 204, 113, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: #15803D;
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #2ECC71;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #27AE60;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #27AE60;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke A, Menu Utama, Lanjut ke C) -->
        <nav class="top-nav">
            <a href="huruf-a.html" class="nav-btn">
                <span>👈</span> Huruf A
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-c.html" class="nav-btn">
                Huruf C <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA B -->
        <div class="hero-letter-box" onclick="speakText('b', 'Ini huruf b ... bunyinya ... beh')">
            <span class="hero-char">b</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata ba - bi - bu -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ba', 'b dan a ... dibaca ... ba')">ba</div>
                <div class="word-card" onclick="speakWord(this, 'bi', 'b dan i ... dibaca ... bi')">bi</div>
                <div class="word-card" onclick="speakWord(this, 'bu', 'b dan u ... dibaca ... bu')">bu</div>
            </div>

            <!-- BARIS 2: Suku Kata be - bo - ba -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'be', 'b dan e ... dibaca ... be')">be</div>
                <div class="word-card" onclick="speakWord(this, 'bo', 'b dan o ... dibaca ... bo')">bo</div>
                <div class="word-card" onclick="speakWord(this, 'ba', 'b dan a ... dibaca ... ba')">ba</div>
            </div>

            <!-- BARIS 3: Gabungan Kata (baba - bibi - bubu) -->
            <div class="word-row">
                <div class="word-card card-pink" onclick="speakWord(this, 'baba', 'ba ... ba ... dibaca ... baba')">baba</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'bibi', 'bi ... bi ... dibaca ... bibi')">bibi</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'bubu', 'bu ... bu ... dibaca ... bubu')">bubu</div>
            </div>

            <!-- BARIS 4: Variasi Kata (boba - babi - babu) -->
            <div class="word-row">
                <div class="word-card card-pink" onclick="speakWord(this, 'boba', 'bo ... ba ... dibaca ... boba')">boba</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'babi', 'ba ... bi ... dibaca ... babi')">babi</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'babu', 'ba ... bu ... dibaca ... babu')">babu</div>
            </div>

            <!-- RINGKASAN BAWAH: ba bi bu be bo -->
            <div class="summary-box" onclick="speakText('ba bi bu be bo', 'Mari baca bersama: ba ... bi ... bu ... be ... bo')">
                <span class="summary-item">ba</span>
                <span class="summary-item">bi</span>
                <span class="summary-item">bu</span>
                <span class="summary-item">be</span>
                <span class="summary-item">bo</span>
            </div>

            <!-- TOMBOL PUTAR SUARA BERURUTAN -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara sebelumnya jika ada

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca jelas dan santai
            utterance.pitch = 1.15;   // Nada suara ceria ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi B secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf b ... bunyinya ... beh",
                "Baris satu: b dan a ... ba ... b dan i ... bi ... b dan u ... bu",
                "Baris dua: b dan e ... be ... b dan o ... bo ... b dan a ... ba",
                "Baris tiga: ba - ba ... bi - bi ... bu - bu",
                "Baris empat: bo - ba ... ba - bi ... ba - bu",
                "Ringkasan: ba ... bi ... bu ... be ... bo",
                "Pintar sekali! Kamu sudah lancar membaca huruf B!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
