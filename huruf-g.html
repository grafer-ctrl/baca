<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf G - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-g: #EA580C;
            --secondary-g: #C2410C;
            --accent-blue: #2575FC;
            --yellow: #FFD93D;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #FFF7ED;
            border-color: #FFEDD5;
            color: var(--primary-g);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA G (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #FFEDD5;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(234, 88, 12, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-g);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #FFF7ED;
            border: 2.5px solid #FFEDD5;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-g);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu biru cerah */
        .card-blue {
            background: #F0F5FF;
            border-color: #D3E4FF;
            color: var(--accent-blue);
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #FFF7ED;
            border: 3px solid #FFEDD5;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(234, 88, 12, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-g);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #EA580C;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #C2410C;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #C2410C;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke F, Menu Utama, Lanjut ke H) -->
        <nav class="top-nav">
            <a href="huruf-f.html" class="nav-btn">
                <span>👈</span> Huruf F
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-h.html" class="nav-btn">
                Huruf H <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA G -->
        <div class="hero-letter-box" onclick="speakText('g', 'Ini huruf g ... bunyinya ... geh')">
            <span class="hero-char">g</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata ga - gi - gu -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ga', 'g dan a ... dibaca ... ga')">ga</div>
                <div class="word-card" onclick="speakWord(this, 'gi', 'g dan i ... dibaca ... gi')">gi</div>
                <div class="word-card" onclick="speakWord(this, 'gu', 'g dan u ... dibaca ... gu')">gu</div>
            </div>

            <!-- BARIS 2: Suku Kata ge - go - ga -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ge', 'g dan e ... dibaca ... ge')">ge</div>
                <div class="word-card" onclick="speakWord(this, 'go', 'g dan o ... dibaca ... go')">go</div>
                <div class="word-card" onclick="speakWord(this, 'ga', 'g dan a ... dibaca ... ga')">ga</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (gaga - gigi - gugu) -->
            <div class="word-row">
                <div class="word-card card-blue" onclick="speakWord(this, 'gaga', 'ga ... ga ... dibaca ... gaga')">gaga</div>
                <div class="word-card card-blue" onclick="speakWord(this, 'gigi', 'gi ... gi ... dibaca ... gigi')">gigi</div>
                <div class="word-card card-blue" onclick="speakWord(this, 'gugu', 'gu ... gu ... dibaca ... gugu')">gugu</div>
            </div>

            <!-- BARIS 4: Variasi Kata Bermakna (dagu - bagi - gogo) -->
            <div class="word-row">
                <div class="word-card card-blue" onclick="speakWord(this, 'dagu', 'da ... gu ... dibaca ... dagu')">dagu</div>
                <div class="word-card card-blue" onclick="speakWord(this, 'bagi', 'ba ... gi ... dibaca ... bagi')">bagi</div>
                <div class="word-card card-blue" onclick="speakWord(this, 'gogo', 'go ... go ... dibaca ... gogo')">gogo</div>
            </div>

            <!-- RINGKASAN BAWAH: ga gi gu ge go -->
            <div class="summary-box" onclick="speakText('ga gi gu ge go', 'Mari baca bersama: ga ... gi ... gu ... ge ... go')">
                <span class="summary-item">ga</span>
                <span class="summary-item">gi</span>
                <span class="summary-item">gu</span>
                <span class="summary-item">ge</span>
                <span class="summary-item">go</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi G secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf g ... bunyinya ... geh",
                "Baris satu: g dan a ... ga ... g dan i ... gi ... g dan u ... gu",
                "Baris dua: g dan e ... ge ... g dan o ... go ... g dan a ... ga",
                "Baris tiga: ga - ga ... gi - gi ... gu - gu",
                "Baris empat: da - gu ... ba - gi ... go - go",
                "Ringkasan: ga ... gi ... gu ... ge ... go",
                "Pintar sekali! Kamu sudah sangat lancar membaca huruf G!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
