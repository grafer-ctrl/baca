<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf F - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-f: #06B6D4;
            --secondary-f: #0891B2;
            --accent-purple: #8B5CF6;
            --yellow: #FFD93D;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #ECFEFF;
            border-color: #A5F3FC;
            color: var(--primary-f);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA F (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #CFFAFE;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(6, 182, 212, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-f);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #ECFEFF;
            border: 2.5px solid #A5F3FC;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-f);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu ungu cerah */
        .card-purple {
            background: #FAF5FF;
            border-color: #E9D5FF;
            color: var(--accent-purple);
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #ECFEFF;
            border: 3px solid #A5F3FC;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(6, 182, 212, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-f);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #06B6D4;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #0891B2;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0891B2;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke E, Menu Utama, Lanjut ke G) -->
        <nav class="top-nav">
            <a href="huruf-e.html" class="nav-btn">
                <span>👈</span> Huruf E
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-g.html" class="nav-btn">
                Huruf G <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA F -->
        <div class="hero-letter-box" onclick="speakText('f', 'Ini huruf f ... bunyinya ... ef')">
            <span class="hero-char">f</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata fa - fi - fu -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'fa', 'f dan a ... dibaca ... fa')">fa</div>
                <div class="word-card" onclick="speakWord(this, 'fi', 'f dan i ... dibaca ... fi')">fi</div>
                <div class="word-card" onclick="speakWord(this, 'fu', 'f dan u ... dibaca ... fu')">fu</div>
            </div>

            <!-- BARIS 2: Suku Kata fe - fo - fa -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'fe', 'f dan e ... dibaca ... fe')">fe</div>
                <div class="word-card" onclick="speakWord(this, 'fo', 'f dan o ... dibaca ... fo')">fo</div>
                <div class="word-card" onclick="speakWord(this, 'fa', 'f dan a ... dibaca ... fa')">fa</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (fafa - fifi - fufu) -->
            <div class="word-row">
                <div class="word-card card-purple" onclick="speakWord(this, 'fafa', 'fa ... fa ... dibaca ... fafa')">fafa</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'fifi', 'fi ... fi ... dibaca ... fifi')">fifi</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'fufu', 'fu ... fu ... dibaca ... fufu')">fufu</div>
            </div>

            <!-- BARIS 4: Variasi Kata Gabungan (fabi - fida - fefe) -->
            <div class="word-row">
                <div class="word-card card-purple" onclick="speakWord(this, 'fabi', 'fa ... bi ... dibaca ... fabi')">fabi</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'fida', 'fi ... da ... dibaca ... fida')">fida</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'fefe', 'fe ... fe ... dibaca ... fefe')">fefe</div>
            </div>

            <!-- RINGKASAN BAWAH: fa fi fu fe fo -->
            <div class="summary-box" onclick="speakText('fa fi fu fe fo', 'Mari baca bersama: fa ... fi ... fu ... fe ... fo')">
                <span class="summary-item">fa</span>
                <span class="summary-item">fi</span>
                <span class="summary-item">fu</span>
                <span class="summary-item">fe</span>
                <span class="summary-item">fo</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi F secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf f ... bunyinya ... ef",
                "Baris satu: f dan a ... fa ... f dan i ... fi ... f dan u ... fu",
                "Baris dua: f dan e ... fe ... f dan o ... fo ... f dan a ... fa",
                "Baris tiga: fa - fa ... fi - fi ... fu - fu",
                "Baris empat: fa - bi ... fi - da ... fe - fe",
                "Ringkasan: fa ... fi ... fu ... fe ... fo",
                "Hebat sekali! Kamu sudah sangat pintar membaca huruf F!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
