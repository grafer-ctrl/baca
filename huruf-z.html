<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf Z - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-z: #10B981;
            --secondary-z: #059669;
            --accent-pink: #EC4899;
            --yellow: #FFD93D;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #ECFDF5;
            border-color: #A7F3D0;
            color: var(--primary-z);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA Z (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #A7F3D0;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(16, 185, 129, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-z);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #ECFDF5;
            border: 2.5px solid #A7F3D0;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-z);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu pink cerah */
        .card-pink {
            background: #FDF2F8;
            border-color: #FCE7F3;
            color: var(--accent-pink);
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #ECFDF5;
            border: 3px solid #A7F3D0;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(16, 185, 129, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-z);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #10B981;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #059669;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #059669;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke Y, Menu Utama, Mengulang ke A) -->
        <nav class="top-nav">
            <a href="huruf-y.html" class="nav-btn">
                <span>👈</span> Huruf Y
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-a.html" class="nav-btn">
                Ulang A <span>🔄</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA Z -->
        <div class="hero-letter-box" onclick="speakText('z', 'Ini huruf z ... bunyinya ... zet')">
            <span class="hero-char">z</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata za - zi - zu -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'za', 'z dan a ... dibaca ... za')">za</div>
                <div class="word-card" onclick="speakWord(this, 'zi', 'z dan i ... dibaca ... zi')">zi</div>
                <div class="word-card" onclick="speakWord(this, 'zu', 'z dan u ... dibaca ... zu')">zu</div>
            </div>

            <!-- BARIS 2: Suku Kata ze - zo - za -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ze', 'z dan e ... dibaca ... ze')">ze</div>
                <div class="word-card" onclick="speakWord(this, 'zo', 'z dan o ... dibaca ... zo')">zo</div>
                <div class="word-card" onclick="speakWord(this, 'za', 'z dan a ... dibaca ... za')">za</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (zaza - zizi - zuzu) -->
            <div class="word-row">
                <div class="word-card card-pink" onclick="speakWord(this, 'zaza', 'za ... za ... dibaca ... zaza')">zaza</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'zizi', 'zi ... zi ... dibaca ... zizi')">zizi</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'zuzu', 'zu ... zu ... dibaca ... zuzu')">zuzu</div>
            </div>

            <!-- BARIS 4: Variasi Kata Bermakna (zaki - zona - zuma) -->
            <div class="word-row">
                <div class="word-card card-pink" onclick="speakWord(this, 'zaki', 'za ... ki ... dibaca ... zaki')">zaki</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'zona', 'zo ... na ... dibaca ... zona')">zona</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'zuma', 'zu ... ma ... dibaca ... zuma')">zuma</div>
            </div>

            <!-- RINGKASAN BAWAH: za zi zu ze zo -->
            <div class="summary-box" onclick="speakText('za zi zu ze zo', 'Mari baca bersama: za ... zi ... zu ... ze ... zo')">
                <span class="summary-item">za</span>
                <span class="summary-item">zi</span>
                <span class="summary-item">zu</span>
                <span class="summary-item">ze</span>
                <span class="summary-item">zo</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi Z secara berurutan & Selamat
        function playLessonSequence() {
            const sequence = [
                "Ini huruf z ... bunyinya ... zet",
                "Baris satu: z dan a ... za ... z dan i ... zi ... z dan u ... zu",
                "Baris dua: z dan e ... ze ... z dan o ... zo ... z dan a ... za",
                "Baris tiga: za - za ... zi - zi ... zu - zu",
                "Baris empat: za - ki ... zo - na ... zu - ma",
                "Ringkasan: za ... zi ... zu ... ze ... zo",
                "Horeee! Selamat! Kamu hebat sekali sudah berhasil belajar membaca semua huruf dari A sampai Z!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
