<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf Q - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-q: #7C3AED;
            --secondary-q: #6D28D9;
            --accent-pink: #EC4899;
            --yellow: #FFD93D;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #F5F3FF;
            border-color: #EDE9FE;
            color: var(--primary-q);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA Q (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #EDE9FE;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(124, 58, 237, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-q);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #F5F3FF;
            border: 2.5px solid #EDE9FE;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-q);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu pink cerah */
        .card-pink {
            background: #FDF2F8;
            border-color: #FCE7F3;
            color: var(--accent-pink);
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #F5F3FF;
            border: 3px solid #EDE9FE;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(124, 58, 237, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-q);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #7C3AED;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #6D28D9;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #6D28D9;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke P, Menu Utama, Lanjut ke R) -->
        <nav class="top-nav">
            <a href="huruf-p.html" class="nav-btn">
                <span>👈</span> Huruf P
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-r.html" class="nav-btn">
                Huruf R <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA Q -->
        <div class="hero-letter-box" onclick="speakText('q', 'Ini huruf q ... bunyinya ... qiu')">
            <span class="hero-char">q</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata qa - qi - qu -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'qa', 'q dan a ... dibaca ... qa')">qa</div>
                <div class="word-card" onclick="speakWord(this, 'qi', 'q dan i ... dibaca ... qi')">qi</div>
                <div class="word-card" onclick="speakWord(this, 'qu', 'q dan u ... dibaca ... qu')">qu</div>
            </div>

            <!-- BARIS 2: Suku Kata qe - qo - qa -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'qe', 'q dan e ... dibaca ... qe')">qe</div>
                <div class="word-card" onclick="speakWord(this, 'qo', 'q dan o ... dibaca ... qo')">qo</div>
                <div class="word-card" onclick="speakWord(this, 'qa', 'q dan a ... dibaca ... qa')">qa</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (qaqa - qiqi - ququ) -->
            <div class="word-row">
                <div class="word-card card-pink" onclick="speakWord(this, 'qaqa', 'qa ... qa ... dibaca ... qaqa')">qaqa</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'qiqi', 'qi ... qi ... dibaca ... qiqi')">qiqi</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'ququ', 'qu ... qu ... dibaca ... ququ')">ququ</div>
            </div>

            <!-- BARIS 4: Variasi Kata Gabungan (qada - qila - qoba) -->
            <div class="word-row">
                <div class="word-card card-pink" onclick="speakWord(this, 'qada', 'qa ... da ... dibaca ... qada')">qada</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'qila', 'qi ... la ... dibaca ... qila')">qila</div>
                <div class="word-card card-pink" onclick="speakWord(this, 'qoba', 'qo ... ba ... dibaca ... qoba')">qoba</div>
            </div>

            <!-- RINGKASAN BAWAH: qa qi qu qe qo -->
            <div class="summary-box" onclick="speakText('qa qi qu qe qo', 'Mari baca bersama: qa ... qi ... qu ... qe ... qo')">
                <span class="summary-item">qa</span>
                <span class="summary-item">qi</span>
                <span class="summary-item">qu</span>
                <span class="summary-item">qe</span>
                <span class="summary-item">qo</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi Q secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf q ... bunyinya ... qiu",
                "Baris satu: q dan a ... qa ... q dan i ... qi ... q dan u ... qu",
                "Baris dua: q dan e ... qe ... q dan o ... qo ... q dan a ... qa",
                "Baris tiga: qa - qa ... qi - qi ... qu - qu",
                "Baris empat: qa - da ... qi - la ... qo - ba",
                "Ringkasan: qa ... qi ... qu ... qe ... qo",
                "Hebat sekali! Kamu sudah sangat lancar membaca huruf Q!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
