<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf J - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-j: #F59E0B;
            --secondary-j: #D97706;
            --accent-purple: #8B5CF6;
            --yellow: #FFD93D;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #FFFBEB;
            border-color: #FEF3C7;
            color: var(--secondary-j);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA J (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #FEF3C7;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(245, 158, 11, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-j);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #FFFBEB;
            border: 2.5px solid #FEF3C7;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--secondary-j);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu ungu cerah */
        .card-purple {
            background: #FAF5FF;
            border-color: #E9D5FF;
            color: var(--accent-purple);
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #FFFBEB;
            border: 3px solid #FEF3C7;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(245, 158, 11, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-j);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #F59E0B;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #D97706;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #D97706;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke I, Menu Utama, Lanjut ke K) -->
        <nav class="top-nav">
            <a href="huruf-i.html" class="nav-btn">
                <span>👈</span> Huruf I
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-k.html" class="nav-btn">
                Huruf K <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA J -->
        <div class="hero-letter-box" onclick="speakText('j', 'Ini huruf j ... bunyinya ... jeh')">
            <span class="hero-char">j</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata ja - ji - ju -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ja', 'j dan a ... dibaca ... ja')">ja</div>
                <div class="word-card" onclick="speakWord(this, 'ji', 'j dan i ... dibaca ... ji')">ji</div>
                <div class="word-card" onclick="speakWord(this, 'ju', 'j dan u ... dibaca ... ju')">ju</div>
            </div>

            <!-- BARIS 2: Suku Kata je - jo - ja -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'je', 'j dan e ... dibaca ... je')">je</div>
                <div class="word-card" onclick="speakWord(this, 'jo', 'j dan o ... dibaca ... jo')">jo</div>
                <div class="word-card" onclick="speakWord(this, 'ja', 'j dan a ... dibaca ... ja')">ja</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (jaja - jiji - juju) -->
            <div class="word-row">
                <div class="word-card card-purple" onclick="speakWord(this, 'jaja', 'ja ... ja ... dibaca ... jaja')">jaja</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'jiji', 'ji ... ji ... dibaca ... jiji')">jiji</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'juju', 'ju ... ju ... dibaca ... juju')">juju</div>
            </div>

            <!-- BARIS 4: Variasi Kata Bermakna (baju - jaga - jadi) -->
            <div class="word-row">
                <div class="word-card card-purple" onclick="speakWord(this, 'baju', 'ba ... ju ... dibaca ... baju')">baju</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'jaga', 'ja ... ga ... dibaca ... jaga')">jaga</div>
                <div class="word-card card-purple" onclick="speakWord(this, 'jadi', 'ja ... di ... dibaca ... jadi')">jadi</div>
            </div>

            <!-- RINGKASAN BAWAH: ja ji ju je jo -->
            <div class="summary-box" onclick="speakText('ja ji ju je jo', 'Mari baca bersama: ja ... ji ... ju ... je ... jo')">
                <span class="summary-item">ja</span>
                <span class="summary-item">ji</span>
                <span class="summary-item">ju</span>
                <span class="summary-item">je</span>
                <span class="summary-item">jo</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi J secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf j ... bunyinya ... jeh",
                "Baris satu: j dan a ... ja ... j dan i ... ji ... j dan u ... ju",
                "Baris dua: j dan e ... je ... j dan o ... jo ... j dan a ... ja",
                "Baris tiga: ja - ja ... ji - ji ... ju - ju",
                "Baris empat: ba - ju ... ja - ga ... ja - di",
                "Ringkasan: ja ... ji ... ju ... je ... jo",
                "Luar biasa! Kamu sudah sangat mahir membaca huruf J!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
