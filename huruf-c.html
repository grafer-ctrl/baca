<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf C - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-c: #10B981;
            --secondary-c: #059669;
            --accent-orange: #FF9F45;
            --yellow: #FFD93D;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #F0FDF4;
            border-color: #BBF7D0;
            color: var(--primary-c);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA C (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #D1FAE5;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(16, 185, 129, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--primary-c);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #F0FDF4;
            border: 2.5px solid #BBF7D0;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-c);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        /* Variasi warna kartu kata oranye */
        .card-orange {
            background: #FFF9F4;
            border-color: #FFE3CC;
            color: #FF8800;
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #F0FDF4;
            border: 3px solid #BBF7D0;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(16, 185, 129, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary-c);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #10B981;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #059669;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #059669;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke B, Menu Utama, Lanjut ke D) -->
        <nav class="top-nav">
            <a href="huruf-b.html" class="nav-btn">
                <span>👈</span> Huruf B
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-d.html" class="nav-btn">
                Huruf D <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA C -->
        <div class="hero-letter-box" onclick="speakText('c', 'Ini huruf c ... bunyinya ... ceh')">
            <span class="hero-char">c</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Suku Kata ca - ci - cu -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ca', 'c dan a ... dibaca ... ca')">ca</div>
                <div class="word-card" onclick="speakWord(this, 'ci', 'c dan i ... dibaca ... ci')">ci</div>
                <div class="word-card" onclick="speakWord(this, 'cu', 'c dan u ... dibaca ... cu')">cu</div>
            </div>

            <!-- BARIS 2: Suku Kata ce - co - ca -->
            <div class="word-row">
                <div class="word-card" onclick="speakWord(this, 'ce', 'c dan e ... dibaca ... ce')">ce</div>
                <div class="word-card" onclick="speakWord(this, 'co', 'c dan o ... dibaca ... co')">co</div>
                <div class="word-card" onclick="speakWord(this, 'ca', 'c dan a ... dibaca ... ca')">ca</div>
            </div>

            <!-- BARIS 3: Gabungan Kata (caca - cici - cucu) -->
            <div class="word-row">
                <div class="word-card card-orange" onclick="speakWord(this, 'caca', 'ca ... ca ... dibaca ... caca')">caca</div>
                <div class="word-card card-orange" onclick="speakWord(this, 'cici', 'ci ... ci ... dibaca ... cici')">cici</div>
                <div class="word-card card-orange" onclick="speakWord(this, 'cucu', 'cu ... cu ... dibaca ... cucu')">cucu</div>
            </div>

            <!-- BARIS 4: Variasi Kata Gabungan (baca - coba - cuci) -->
            <div class="word-row">
                <div class="word-card card-orange" onclick="speakWord(this, 'baca', 'ba ... ca ... dibaca ... baca')">baca</div>
                <div class="word-card card-orange" onclick="speakWord(this, 'coba', 'co ... ba ... dibaca ... coba')">coba</div>
                <div class="word-card card-orange" onclick="speakWord(this, 'cuci', 'cu ... ci ... dibaca ... cuci')">cuci</div>
            </div>

            <!-- RINGKASAN BAWAH: ca ci cu ce co -->
            <div class="summary-box" onclick="speakText('ca ci cu ce co', 'Mari baca bersama: ca ... ci ... cu ... ce ... co')">
                <span class="summary-item">ca</span>
                <span class="summary-item">ci</span>
                <span class="summary-item">cu</span>
                <span class="summary-item">ce</span>
                <span class="summary-item">co</span>
            </div>

            <!-- TOMBOL PUTAR SUARA BERURUTAN -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan santai dan artikulasi jelas
            utterance.pitch = 1.15;   // Nada ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi C secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf c ... bunyinya ... ceh",
                "Baris satu: c dan a ... ca ... c dan i ... ci ... c dan u ... cu",
                "Baris dua: c dan e ... ce ... c dan o ... co ... c dan a ... ca",
                "Baris tiga: ca - ca ... ci - ci ... cu - cu",
                "Baris empat: ba - ca ... co - ba ... cu - ci",
                "Ringkasan: ca ... ci ... cu ... ce ... co",
                "Luar biasa! Kamu sudah pintar membaca huruf C!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
