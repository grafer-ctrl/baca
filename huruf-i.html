<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf I - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-i: #2563EB;
            --secondary-i: #1D4ED8;
            --accent-vowel: #FF3366;
            --yellow: #FFD93D;
            --green: #2ECC71;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #EFF6FF;
            border-color: #DBEAFE;
            color: var(--primary-i);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA I (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #DBEAFE;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(37, 99, 235, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--accent-vowel);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #F8FBFF;
            border: 2.5px solid #D7E5F6;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        .color-vowel {
            color: var(--accent-vowel);
            border-color: #FFE4E6;
            background: #FFF1F2;
        }

        .color-word {
            color: var(--primary-i);
            border-color: #DBEAFE;
            background: #EFF6FF;
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #EFF6FF;
            border: 3px solid #DBEAFE;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(37, 99, 235, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-i);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #2563EB;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #1D4ED8;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1D4ED8;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke H, Menu Utama, Lanjut ke J) -->
        <nav class="top-nav">
            <a href="huruf-h.html" class="nav-btn">
                <span>👈</span> Huruf H
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-j.html" class="nav-btn">
                Huruf J <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA I -->
        <div class="hero-letter-box" onclick="speakText('i', 'Ini huruf i ... bunyinya ... i')">
            <span class="hero-char">i</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Bunyi Vokal Dasar & Suku Kata bi -->
            <div class="word-row">
                <div class="word-card color-vowel" onclick="speakWord(this, 'i i', 'Huruf i dan i ... dibaca ... i - i')">ii</div>
                <div class="word-card color-vowel" onclick="speakWord(this, 'i i', 'Huruf i dan i ... dibaca ... i - i')">ii</div>
                <div class="word-card color-word" onclick="speakWord(this, 'bi', 'Huruf b dan i ... dibaca ... bi')">bi</div>
            </div>

            <!-- BARIS 2: Suku Kata ci dan di -->
            <div class="word-row">
                <div class="word-card color-vowel" onclick="speakWord(this, 'i i', 'Huruf i dan i ... dibaca ... i - i')">ii</div>
                <div class="word-card color-word" onclick="speakWord(this, 'ci', 'Huruf c dan i ... dibaca ... ci')">ci</div>
                <div class="word-card color-word" onclick="speakWord(this, 'di', 'Huruf d dan i ... dibaca ... di')">di</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (gigi - bibi - cici) -->
            <div class="word-row">
                <div class="word-card color-word" onclick="speakWord(this, 'gigi', 'gi ... gi ... dibaca ... gigi')">gigi</div>
                <div class="word-card color-word" onclick="speakWord(this, 'bibi', 'bi ... bi ... dibaca ... bibi')">bibi</div>
                <div class="word-card color-word" onclick="speakWord(this, 'cici', 'ci ... ci ... dibaca ... cici')">cici</div>
            </div>

            <!-- BARIS 4: Variasi Kata Bermakna (dahi - bagi - hobi) -->
            <div class="word-row">
                <div class="word-card color-word" onclick="speakWord(this, 'dahi', 'da ... hi ... dibaca ... dahi')">dahi</div>
                <div class="word-card color-word" onclick="speakWord(this, 'bagi', 'ba ... gi ... dibaca ... bagi')">bagi</div>
                <div class="word-card color-word" onclick="speakWord(this, 'hobi', 'ho ... bi ... dibaca ... hobi')">hobi</div>
            </div>

            <!-- RINGKASAN BAWAH: i bi ci di gi hi -->
            <div class="summary-box" onclick="speakText('i bi ci di gi hi', 'Mari baca bersama: i ... bi ... ci ... di ... gi ... hi')">
                <span class="summary-item" style="color: var(--accent-vowel);">i</span>
                <span class="summary-item">bi</span>
                <span class="summary-item">ci</span>
                <span class="summary-item">di</span>
                <span class="summary-item">gi</span>
                <span class="summary-item">hi</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi I secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf i ... bunyinya ... i",
                "Baris satu: i - i ... i - i ... bi",
                "Baris dua: i - i ... ci ... di",
                "Baris tiga: gi - gi ... bi - bi ... ci - ci",
                "Baris empat: da - hi ... ba - gi ... ho - bi",
                "Ringkasan: i ... bi ... ci ... di ... gi ... hi",
                "Pintar sekali! Kamu sudah sangat lancar membaca huruf vokal I!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
