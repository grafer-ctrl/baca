<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belajar Membaca Huruf O - PAUD & TK</title>
    
    <!-- Google Fonts Ramah Anak -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-o: #EA580C;
            --secondary-o: #C2410C;
            --accent-vowel: #FF3366;
            --blue-word: #2575FC;
            --yellow: #FFD93D;
            --green: #2ECC71;
            --bg-color: #F8FBFF;
            --shadow-btn: 0 5px 0 rgba(0,0,0,0.12);
            --shadow-btn-active: 0 1px 0 rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#E2EDF9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* NAVIGASI ATAS */
        .top-nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: #FFFFFF;
            border: 2px solid #DCE6F2;
            padding: 8px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #4A5568;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s ease;
            white-space: nowrap;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .nav-btn.home {
            background: #FFF7ED;
            border-color: #FFEDD5;
            color: var(--primary-o);
        }

        /* SLOT IKLAN AUTO-HIDE */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .ad-container:empty {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* HURUF UTAMA O (HERO BOX) */
        .hero-letter-box {
            background: #FFFFFF;
            border: 3px solid #FFEDD5;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(234, 88, 12, 0.15);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .hero-letter-box:active {
            transform: scale(0.96);
        }

        .hero-char {
            font-size: 4.2rem;
            font-weight: 800;
            color: var(--accent-vowel);
            line-height: 1;
        }

        .tap-hint {
            font-size: 0.8rem;
            color: #8C9BAE;
            margin-top: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* AREA LATIHAN MEMBACA */
        .reading-board {
            background: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #E4EDF8;
            padding: 16px 14px;
            box-shadow: var(--shadow-btn);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-title {
            text-align: center;
            font-size: 0.85rem;
            color: #7B8A9E;
            font-weight: 700;
        }

        /* BARIS KATA (3 KOLOM) */
        .word-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        /* KARTU KATA */
        .word-card {
            background: #F8FBFF;
            border: 2.5px solid #D7E5F6;
            border-radius: 16px;
            padding: 12px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .word-card:active, .word-card.speaking {
            transform: translateY(3px);
            box-shadow: var(--shadow-btn-active);
            background: #FFF9DB;
            border-color: #FFD43B;
            color: #D97706;
        }

        .color-vowel {
            color: var(--accent-vowel);
            border-color: #FFE4E6;
            background: #FFF1F2;
        }

        .color-word {
            color: var(--blue-word);
            border-color: #DBEAFE;
            background: #EFF6FF;
        }

        /* KOTAK RANGKUMAN BAWAH */
        .summary-box {
            background: #FFF7ED;
            border: 3px solid #FFEDD5;
            border-radius: 20px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 4px 0 rgba(234, 88, 12, 0.15);
            cursor: pointer;
        }

        .summary-item {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-o);
        }

        /* TOMBOL PUTAR SEMUA */
        .play-all-btn {
            background: #EA580C;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0 #C2410C;
            cursor: pointer;
        }

        .play-all-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #C2410C;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #9AA8BA;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVIGASI 3 ARAH (Kembali ke N, Menu Utama, Lanjut ke P) -->
        <nav class="top-nav">
            <a href="huruf-n.html" class="nav-btn">
                <span>👈</span> Huruf N
            </a>
            <a href="index.html" class="nav-btn home">
                <span>🏠</span> Menu Utama
            </a>
            <a href="huruf-p.html" class="nav-btn">
                Huruf P <span>👉</span>
            </a>
        </nav>

        <!-- SLOT IKLAN ATAS (Auto-Hide) -->
        <div id="ad-top" class="ad-container"></div>

        <!-- HURUF UTAMA O -->
        <div class="hero-letter-box" onclick="speakText('o', 'Ini huruf o ... bunyinya ... o')">
            <span class="hero-char">o</span>
            <div class="tap-hint">
                <span>🔊</span> Ketuk untuk mendengar suara
            </div>
        </div>

        <!-- PAPAN LATIHAN MEMBACA -->
        <main class="reading-board">
            <div class="board-title">👇 Sentuh kotak untuk mendengarkan bunyinya:</div>

            <!-- BARIS 1: Bunyi Vokal Dasar & Suku Kata bo -->
            <div class="word-row">
                <div class="word-card color-vowel" onclick="speakWord(this, 'o o', 'Huruf o dan o ... dibaca ... o - o')">oo</div>
                <div class="word-card color-vowel" onclick="speakWord(this, 'o o', 'Huruf o dan o ... dibaca ... o - o')">oo</div>
                <div class="word-card color-word" onclick="speakWord(this, 'bo', 'Huruf b dan o ... dibaca ... bo')">bo</div>
            </div>

            <!-- BARIS 2: Suku Kata do dan go -->
            <div class="word-row">
                <div class="word-card color-vowel" onclick="speakWord(this, 'o o', 'Huruf o dan o ... dibaca ... o - o')">oo</div>
                <div class="word-card color-word" onclick="speakWord(this, 'do', 'Huruf d dan o ... dibaca ... do')">do</div>
                <div class="word-card color-word" onclick="speakWord(this, 'go', 'Huruf g dan o ... dibaca ... go')">go</div>
            </div>

            <!-- BARIS 3: Gabungan Suku Kata (bobo - dodo - koko) -->
            <div class="word-row">
                <div class="word-card color-word" onclick="speakWord(this, 'bobo', 'bo ... bo ... dibaca ... bobo')">bobo</div>
                <div class="word-card color-word" onclick="speakWord(this, 'dodo', 'do ... do ... dibaca ... dodo')">dodo</div>
                <div class="word-card color-word" onclick="speakWord(this, 'koko', 'ko ... ko ... dibaca ... koko')">koko</div>
            </div>

            <!-- BARIS 4: Variasi Kata Bermakna (bola - kado - boba) -->
            <div class="word-row">
                <div class="word-card color-word" onclick="speakWord(this, 'bola', 'bo ... la ... dibaca ... bola')">bola</div>
                <div class="word-card color-word" onclick="speakWord(this, 'kado', 'ka ... do ... dibaca ... kado')">kado</div>
                <div class="word-card color-word" onclick="speakWord(this, 'boba', 'bo ... ba ... dibaca ... boba')">boba</div>
            </div>

            <!-- RINGKASAN BAWAH: o bo do go ko lo -->
            <div class="summary-box" onclick="speakText('o bo do go ko lo', 'Mari baca bersama: o ... bo ... do ... go ... ko ... lo')">
                <span class="summary-item" style="color: var(--accent-vowel);">o</span>
                <span class="summary-item">bo</span>
                <span class="summary-item">do</span>
                <span class="summary-item">go</span>
                <span class="summary-item">ko</span>
                <span class="summary-item">lo</span>
            </div>

            <!-- TOMBOL PUTAR SEMUA -->
            <button class="play-all-btn" onclick="playLessonSequence()">
                <span>▶️</span> Putar Suara Pelajaran Ini
            </button>
        </main>

        <!-- SLOT IKLAN BAWAH (Auto-Hide) -->
        <div id="ad-bottom" class="ad-container"></div>

        <footer>
            <p>Belajar Membaca PAUD & TK &copy; 2025</p>
        </footer>
    </div>

    <!-- SISTEM SUARA (WEB SPEECH API BAHASA INDONESIA) -->
    <script>
        function speakText(text, fullExplanation, onEndCallback) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda belum mendukung suara otomatis.');
                return;
            }

            window.speechSynthesis.cancel(); // Hentikan suara jika sedang aktif

            const message = fullExplanation || text;
            const utterance = new SpeechSynthesisUtterance(message);
            
            utterance.lang = 'id-ID'; // Bahasa Indonesia
            utterance.rate = 0.82;    // Kecepatan membaca santai dan jelas
            utterance.pitch = 1.15;   // Nada suara ramah anak

            if (onEndCallback) {
                utterance.onend = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function speakWord(element, word, explanation) {
            element.classList.add('speaking');
            speakText(word, explanation, () => {
                element.classList.remove('speaking');
            });
        }

        // Putar suara seluruh materi O secara berurutan
        function playLessonSequence() {
            const sequence = [
                "Ini huruf o ... bunyinya ... o",
                "Baris satu: o - o ... o - o ... bo",
                "Baris dua: o - o ... do ... go",
                "Baris tiga: bo - bo ... do - do ... ko - ko",
                "Baris empat: bo - la ... ka - do ... bo - ba",
                "Ringkasan: o ... bo ... do ... go ... ko ... lo",
                "Pintar sekali! Kamu sudah sangat lancar membaca huruf vokal O!"
            ];

            let index = 0;
            function next() {
                if (index < sequence.length) {
                    speakText('', sequence[index], () => {
                        index++;
                        setTimeout(next, 500);
                    });
                }
            }
            next();
        }
    </script>
</body>
</html>
